name: Release

on:
    push:
        tags:
            - "*@[0-9]+.[0-9]+.[0-9]+"
            - "!*@[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+"
            - "!*@[0-9]+.[0-9]+.[0-9]+-post.[0-9]+"

permissions: {}

jobs:
    prepare:
        name: Prepare release
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        outputs:
            artifact-filename: >-
                ${{ steps.release.outputs['artifact-filename'] }}
            payload-name: ${{ steps.payload.outputs.name }}
        steps:
            - name: Check out the repository
              # v7.0.1
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Require a release commit on trunk
              run: |
                  if ! git merge-base --is-ancestor \
                      "$GITHUB_SHA" refs/remotes/origin/trunk; then
                      echo "The release commit must be an ancestor of trunk." >&2
                      exit 1
                  fi
            - name: Set up Node.js
              # v7.0.0
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24.14.1
                  cache: npm
                  cache-dependency-path: package-lock.json
            - name: Plan the release
              id: release
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
                  RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
              run: node scripts/github-release/cli.ts
            - name: Install locked dependencies
              run: npm ci
            - name: Install Chromium for dialog layout tests
              run: npx playwright install --with-deps chromium
            - name: Verify the workspace
              run: npm run verify
            - name: Build the release artifact
              env:
                  PACKAGE_NAME: ${{ steps.release.outputs['package-name'] }}
              run: npm run build -w "$PACKAGE_NAME"
            - name: Stage the release payload
              id: payload
              env:
                  ARTIFACT_FILENAME: >-
                      ${{ steps.release.outputs['artifact-filename'] }}
                  ARTIFACT_PATH: ${{ steps.release.outputs['artifact-path'] }}
                  RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
              run: |
                  payload_directory="$RUNNER_TEMP/release-payload"
                  echo "name=release-payload-${GITHUB_RUN_ATTEMPT}" \
                      >> "$GITHUB_OUTPUT"
                  mkdir -p "$payload_directory"
                  cp -- \
                      "$ARTIFACT_PATH" \
                      "$payload_directory/$ARTIFACT_FILENAME"
                  cp -- \
                      "$RELEASE_NOTES_PATH" \
                      "$payload_directory/release-notes.md"
            - name: Upload the release payload
              # v7.0.1
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: ${{ steps.payload.outputs.name }}
                  path: ${{ runner.temp }}/release-payload
                  if-no-files-found: error
                  retention-days: 1
            - name: Upload failed dialog layout artifacts
              if: failure()
              # v7.0.1
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: dialog-layout-artifacts-${{ github.run_attempt }}
                  path: .cache/playwright
                  if-no-files-found: ignore
                  include-hidden-files: true
                  retention-days: 7

    publish:
        name: Publish release
        needs: prepare
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - name: Download the release payload
              # v8.0.1
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: ${{ needs.prepare.outputs.payload-name }}
                  path: ${{ runner.temp }}/release-payload
            - name: Verify the remote tag target
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  remote_sha="$(
                      gh api \
                          "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" \
                          --jq ".sha"
                  )"
                  if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
                      echo "The release tag no longer targets the triggering commit." >&2
                      exit 1
                  fi
            - name: Create the GitHub release
              env:
                  ARTIFACT_FILENAME: >-
                      ${{ needs.prepare.outputs['artifact-filename'] }}
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  payload_directory="$RUNNER_TEMP/release-payload"
                  gh release create \
                      "$RELEASE_TAG" \
                      "$payload_directory/$ARTIFACT_FILENAME" \
                      --repo "$GITHUB_REPOSITORY" \
                      --title "$RELEASE_TAG" \
                      --notes-file "$payload_directory/release-notes.md" \
                      --verify-tag \
                      --latest=false
